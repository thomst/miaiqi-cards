{% load markdown %}

<div class="contact">
    {{ contact.text|markdown_to_html }}

    <form method="POST" data-url="{% url 'contact-submit' contact.id %}">
        {% csrf_token %}

        {% for error in form.non_field_errors %}
            <div class="row"><div class="error">{{ error }}</div></div>
        {% endfor %}

        {% for field in form %}
            <div class="row">
                <div{% if field.errors %} class="error"{% endif %}>{{ field }}</div>
            </div>
        {% endfor %}

        <div class="row">
            <div><input type="submit" value="Send"></div>
        </div>
    </form>
</div>
