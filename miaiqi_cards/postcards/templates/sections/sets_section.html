{% load sections sets %}

<section id="{{ section|as_html_id }}" class="{{ section|as_html_class }}">
    <h2>{{ section.title }}</h2>
    <div>
        {% for postcard_set in section.postcard_sets.all %}
            <div class="postcard-set">
                <a href="{% url 'postcard_set' section.slug postcard_set.slug %}">
                    {% postcards_grid postcard_set.postcards.all as postcards %}
                    <div class="postcard-stack" style="--count: {{ postcards|length }};">
                        {% for postcard in postcards %}
                            {% if postcard %}
                                <figure>
                                    <img
                                        class="postcard"
                                        src="{{ postcard.image.small.url }}"
                                        alt="{{ postcard.title }}">
                                </figure>
                            {% else %}
                                <figure class="postcard-placeholder"></figure>
                            {% endif %}
                        {% endfor %}
                    </div>
                    <h3>{{ postcard_set.title }}</h3>
                </a>
            </div>
        {% endfor %}
    </div>
</section>
