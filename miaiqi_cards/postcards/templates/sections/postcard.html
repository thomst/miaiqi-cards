{% load sections static markdown navigation%}

{% partialdef head %}
    <link
        rel="preload"
        href="{{ section.image.url }}"
        imagesrcset="{{ section.image.srcset }}"
        imagesizes="(max-width: 680px) 80vw, 60vh"
        as="image"
        type="image/avif"
        fetchpriority="high">
{% endpartialdef %}


<section class="postcard-section">

    <h1>{{ section.title }}</h1>
    <div class="postcard">
        <img
            class="postcard-image"
            src="{{ section.image.large.url }}"
            srcset="{{ section.image.srcset }}"
            sizes="(max-width: 680px) 80vw, 60vh"
            fetchpriority="high"
            alt="{{ section.title }}">

        {% if section.description %}
            <div>{{ section.description|markdown_to_html }}</div>
        {% endif %}
    </div>

    {% navigation url_params %}

</section>
