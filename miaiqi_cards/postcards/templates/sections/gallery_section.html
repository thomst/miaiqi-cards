{% load sections %}

<section id="{{ section|as_html_id }}" class="{{ section|as_html_class }}">
    <h2>{{ section.title }}</h2>
    <div>
        {% for postcard in section.postcards.all %}
            <a href="{% url 'postcard' gallery_slug=section.slug postcard_id=postcard.pk %}">
                <figure>
                    <img
                        class="postcard"
                        src="{{ postcard.image.medium.url }}"
                        srcset="{{ postcard.image.srcset }}"
                        sizes="(max-width: 680px) 80vw, 22vw"
                        fetchpriority="high"
                        alt="{{ postcard.title }}">
                    <figcaption>{{ postcard.title }}</figcaption>
                </figure>
            </a>
        {% endfor %}
        <div class="postcard">More are coming soon...</div>
    </div>
</section>
