{% load markdown %}

<div class="shop" data-step="confirmation">
    {{ shop.confirmation_text|markdown_to_html }}

    {% for item in cart %}
        <div class="row item">
            <div>{{ item.product }}</div><div>{{ item.quantity }} Stk.</div><div>{{ item.total_price }} €</div>
        </div>
    {% endfor %}

    <div class="row total"><div>Total</div><div>{{ cart.total }} €</div></div>

    <div class="row button">
        <div><input type="button" value="Back" data-url="{% url 'shop-description' shop.id %}" data-method="get"></div>
    </div>

</div>
