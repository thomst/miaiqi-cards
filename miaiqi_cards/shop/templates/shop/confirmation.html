{% load markdown %}

<div class="shop">
    {{ shop.confirmation_text|markdown_to_html }}

    {% for item in cart %}
        <div class="row">
            <div>{{ item.product }}</div><div>{{ item.quantity }} Stk.</div><div>{{ item.total_price }} €</div>
        </div>
    {% endfor %}

    <div class="row"><div>Total</div><div>{{ cart.total }} €</div></div>

    <div class="row">
        <div><input type="button" value="New" data-url="{% url 'shop-order' shop.id %}" data-method="get"></div>
    </div>

</div>
