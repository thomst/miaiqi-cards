{% load markdown %}

<div class="shop">
    {{ shop.checkout_text|markdown_to_html }}

    <form>
        {% csrf_token %}

        {% for item in cart %}
            <div class="row">
                <div>{{ item.product }}</div><div>{{ item.quantity }} Stk.</div><div>{{ item.total_price }} €</div>
            </div>
        {% endfor %}

        <div class="row"><div>Total</div><div>{{ cart.total }} €</div></div>

        <div class="row">
            {% for field in email_form %}<div{% if field.errors %} class="error"{% endif %}>{{ field }}</div>{% endfor %}
        </div>

        <div class="row">
            <div><input type="button" value="Back" data-url="{% url 'shop-order' shop.id %}?back" data-action="order"></div>
            <div><input type="button" value="Buy" data-url="{% url 'shop-confirmation' shop.id %}?buy" data-action="confirmation"></div>
        </div>
    </form>

</div>
