{% load markdown %}

<div class="shop" data-step="order">
    {{ shop.order_text|markdown_to_html }}

    {% for item in cart %}
        <div class="row item">
            <div>{{ item.product }}</div>
            <div>{{ item.quantity }} Stk.</div>
            <div><input class="remove-item" type="button" value="Löschen" data-url="{% url 'update-product' shop.pk item.product.pk %}"></div>
        </div>
    {% empty %}
        <div class="row item">
            <div>Choose your postcards above...</div>
        </div>
    {% endfor %}

    <div class="row button">
        <div><input type="button" value="Zurück" data-url="{% url 'shop-description' shop.id %}"></div>
        <div><input type="button" value="Weiter" data-url="{% url 'shop-cart' shop.id %}"{% if cart.is_empty %} disabled{% endif %}></div>
    </div>

</div>
