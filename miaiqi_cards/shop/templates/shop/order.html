{% load markdown i18n %}

<div class="shop">
    {{ shop.order_text|markdown_to_html }}

    <form method="POST">
        {% csrf_token %}
        {{ formset.management_form }}

        {% for form in formset %}
            {% if forloop.first %}
                <div class="row">
                    {% for field in form %}<div>{{ field.label }}</div>{% endfor %}
                    <div></div>
                </div>
            {% endif %}
            <div class="row form">
                {% for field in form %}
                    <div{% if field.errors %} class="error"{% endif %}>{{ field }}</div>
                {% endfor %}
                <div><input class="remove-form" type="button" value="{% trans 'Löschen' %}"></div>
            </div>
        {% endfor %}

        <div class="row">
            <div><input type="button" value="{% trans 'Hinzufügen' %}" data-action="addForm"></div>
            <div><input type="button" value="{% trans 'Zur Kasse' %}" data-url="{% url 'shop-checkout' shop.id %}?checkout" data-action="checkout"></div>
        </div>

    </form>
</div>
